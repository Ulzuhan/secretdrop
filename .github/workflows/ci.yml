name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Antes del build: son funciones puras y fallan en un cuarto de segundo.
      # Cubren idValido() y enRango(), que son justo las dos que permitían una
      # travesía de rutas y un secreto que no caducaba nunca.
      - run: npm run test:unit

      - run: npm run build
      - run: npm run test:http

      # Con un proveedor de mentira que FIRMA de verdad: el aviso de cierre de
      # sesión no se puede probar de otra forma.
      - run: npm run test:backchannel

      # Arranca dos veces con el mismo almacén: es la única forma de ver el
      # listado en frío, que es donde se perdía la carrera de inicialización.
      # Cuesta un par de segundos.
      - run: npm run test:reinicio

      # After the build on purpose: Next generates the route types the checker
      # relies on (.next/types) during the build.
      - run: npx tsc --noEmit

      # ─── El backend Go ────────────────────────────────────────────────
      # El port se sostiene sólo si las MISMAS suites pasan contra las dos
      # implementaciones. Aquí se compila, se prueban las carreras del almacén
      # y la sesión, y después se vuelven a correr las suites HTTP apuntando al
      # binario Go en vez de a Node.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.1'
          cache: false

      # `./...` entraría en node_modules, que trae un paquete Go dentro.
      - run: go vet ./cmd/... ./internal/...
      - run: go test -race -count=1 ./cmd/... ./internal/...
      - run: go build -o ./secretdrop ./cmd/secretdrop

      - name: Las suites HTTP, contra el binario Go
        env:
          SECRETDROP_TEST_LAUNCH: ./secretdrop
          SECRETDROP_TEST_BUILD_STAMP: ./secretdrop
        run: ./scripts/run-suites.sh secretos contratos

      - name: El listado en frío y tras reiniciar, contra el binario Go
        env:
          SECRETDROP_TEST_LAUNCH: ./secretdrop
        run: npm run test:reinicio
