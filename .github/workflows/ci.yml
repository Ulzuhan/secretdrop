name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      digest:
        description: Exact tested and scanned OCI index
        value: ${{ jobs.imagen.outputs.digest }}
      source:
        description: Exact checked out source revision of that OCI
        value: ${{ jobs.imagen.outputs.source }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: python3 -m unittest discover -s scripts/tests -v
      - name: Release tag must match the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF#refs/tags/v}" = "$(node -p 'require("./package.json").version')"
      # Build React before embedding it; no generated assets are committed.
      - run: npm run build
      - run: go vet ./cmd/... ./internal/...
      - run: npm run test:go
      - run: npm run test:http
      - run: npm run test:backchannel
      - run: npm run test:reinicio
      - run: npx playwright install --with-deps chromium
      - name: Browser journey against the Go binary
        run: npm run test:navegador
      # The published, digest-pinned legacy image is a rollback fixture only.
      - name: Node image → Go → Node image, one writer at a time
        run: npm run test:compatibilidad

  imagen:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.artifact.outputs.digest }}
      source: ${{ steps.artifact.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: artifact
        uses: ./.github/actions/verified-oci

  artifact-roundtrip:
    needs: imagen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: secretdrop-oci-${{ github.run_id }}
          path: ${{ runner.temp }}/transfer
      - name: Verify transferred tested OCI without registry writes or rebuilding
        env:
          DIGEST: ${{ needs.imagen.outputs.digest }}
          SOURCE: ${{ needs.imagen.outputs.source }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y skopeo
          test "$(cat "$RUNNER_TEMP/transfer/secretdrop-oci-source.txt")" = "$SOURCE"
          test "$(cat "$RUNNER_TEMP/transfer/secretdrop-oci-digest.txt")" = "$DIGEST"
          tar -C "$RUNNER_TEMP/transfer" -xf "$RUNNER_TEMP/transfer/secretdrop-oci.tar"
          python3 scripts/oci-release.py verify --layout "$RUNNER_TEMP/transfer/secretdrop.oci" --digest "$DIGEST" --source "$SOURCE"
