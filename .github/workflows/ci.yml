name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      digest:
        description: Exact tested and scanned multi-arch OCI index
        value: ${{ jobs.oci-merge.outputs.digest }}
      source:
        description: Exact checked out source revision of that OCI
        value: ${{ jobs.oci-merge.outputs.source }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: python3 -m unittest discover -s scripts/tests -v
      - name: Release tag must match the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF#refs/tags/v}" = "$(node -p 'require("./package.json").version')"
      # Build React before embedding it; no generated assets are committed.
      - run: npm run build
      - run: go vet ./cmd/... ./internal/...
      - run: npm run test:go
      - run: npm run test:http
      - run: npm run test:backchannel
      - run: npm run test:reinicio
      - run: npx playwright install --with-deps chromium
      - name: Browser journey against the Go binary
        run: npm run test:navegador
      # The published, digest-pinned legacy image is a rollback fixture only.
      - name: Node image → Go → Node image, one writer at a time
        run: npm run test:compatibilidad

  imagen:
    name: OCI artifact (linux/amd64)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.artifact.outputs.digest }}
      source: ${{ steps.artifact.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: artifact
        uses: ./.github/actions/verified-oci
        with:
          arch: amd64

  imagen-arm64:
    name: OCI artifact (linux/arm64)
    needs: checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.artifact.outputs.digest }}
      source: ${{ steps.artifact.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: artifact
        uses: ./.github/actions/verified-oci
        with:
          arch: arm64

  oci-merge:
    name: Merge multi-arch OCI layout
    needs: [imagen, imagen-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
      source: ${{ steps.merge.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: secretdrop-oci-amd64-${{ github.run_id }}
          path: ${{ runner.temp }}/amd64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: secretdrop-oci-arm64-${{ github.run_id }}
          path: ${{ runner.temp }}/arm64
      - id: merge
        name: Install skopeo, merge and verify multi-arch OCI
        env:
          AMD64_DIGEST: ${{ needs.imagen.outputs.digest }}
          ARM64_DIGEST: ${{ needs.imagen-arm64.outputs.digest }}
          AMD64_SOURCE: ${{ needs.imagen.outputs.source }}
          ARM64_SOURCE: ${{ needs.imagen-arm64.outputs.source }}
        run: |
          test "$AMD64_SOURCE" = "$ARM64_SOURCE"
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y skopeo
          tar -C "$RUNNER_TEMP/amd64" -xf "$RUNNER_TEMP/amd64/secretdrop-oci-amd64.tar"
          tar -C "$RUNNER_TEMP/arm64" -xf "$RUNNER_TEMP/arm64/secretdrop-oci-arm64.tar"
          merged=$(python3 scripts/oci-release.py merge \
            --amd64-layout "$RUNNER_TEMP/amd64/secretdrop.oci" --amd64-digest "$AMD64_DIGEST" \
            --arm64-layout "$RUNNER_TEMP/arm64/secretdrop.oci" --arm64-digest "$ARM64_DIGEST" \
            --source "$AMD64_SOURCE" --out "$RUNNER_TEMP/secretdrop.oci")
          tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/secretdrop-oci.tar" secretdrop.oci
          printf '%s\n' "$AMD64_SOURCE" > "$RUNNER_TEMP/secretdrop-oci-source.txt"
          printf '%s\n' "$merged" > "$RUNNER_TEMP/secretdrop-oci-digest.txt"
          echo "digest=$merged" >> "$GITHUB_OUTPUT"
          echo "source=$AMD64_SOURCE" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secretdrop-oci-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/secretdrop-oci.tar
            ${{ runner.temp }}/secretdrop-oci-source.txt
            ${{ runner.temp }}/secretdrop-oci-digest.txt
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  artifact-roundtrip:
    needs: oci-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: secretdrop-oci-${{ github.run_id }}
          path: ${{ runner.temp }}/transfer
      - name: Verify transferred tested OCI without registry writes or rebuilding
        env:
          DIGEST: ${{ needs.oci-merge.outputs.digest }}
          SOURCE: ${{ needs.oci-merge.outputs.source }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y skopeo
          test "$(cat "$RUNNER_TEMP/transfer/secretdrop-oci-source.txt")" = "$SOURCE"
          test "$(cat "$RUNNER_TEMP/transfer/secretdrop-oci-digest.txt")" = "$DIGEST"
          tar -C "$RUNNER_TEMP/transfer" -xf "$RUNNER_TEMP/transfer/secretdrop-oci.tar"
          python3 scripts/oci-release.py verify --layout "$RUNNER_TEMP/transfer/secretdrop.oci" --digest "$DIGEST" --source "$SOURCE"
