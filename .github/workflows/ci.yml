name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      # Build React before embedding it; no generated assets are committed.
      - run: npm run build
      - run: go vet ./cmd/... ./internal/...
      - run: npm run test:go
      - run: npm run test:http
      - run: npm run test:backchannel
      - run: npm run test:reinicio
      - run: npx playwright install --with-deps chromium
      - name: Browser journey against the Go binary
        run: npm run test:navegador
      # The published, digest-pinned legacy image is a rollback fixture only.
      - name: Node image → Go → Node image, one writer at a time
        run: npm run test:compatibilidad
      - run: docker build -t secretdrop-cleanup:ci .
      - name: Browser journey against the final image
        env:
          SECRETDROP_TEST_LAUNCH: bash scripts/lanzar-imagen.sh
          SECRETDROP_TEST_IMAGE: secretdrop-cleanup:ci
        run: npm run test:navegador
