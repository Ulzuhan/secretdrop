name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Antes del build: son funciones puras y fallan en un cuarto de segundo.
      # Cubren idValido() y enRango(), que son justo las dos que permitían una
      # travesía de rutas y un secreto que no caducaba nunca.
      - run: npm run test:unit

      - run: npm run build
      - run: npm run test:http

      # Con un proveedor de mentira que FIRMA de verdad: el aviso de cierre de
      # sesión no se puede probar de otra forma.
      - run: npm run test:backchannel

      # After the build on purpose: Next generates the route types the checker
      # relies on (.next/types) during the build.
      - run: npx tsc --noEmit
